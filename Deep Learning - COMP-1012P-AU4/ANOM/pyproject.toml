[project]
name = "cs-8001-odl-public"
version = "0.1.0"
description = "Course notebooks environment"
requires-python = ">=3.11"
dependencies = [
  "ipykernel>=6.30.1",
  "jupyterlab>=4.4.6",
  "matplotlib>=3.10.5",
  "torch>=2.8.0",
  "torchvision>=0.23.0",
]

# GPU-only deps; Triton exists only for Linux x86_64
[project.optional-dependencies]
gpu = [
  "triton==3.4.0 ; platform_system == 'Linux' and (platform_machine == 'x86_64' or platform_machine == 'AMD64')",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

# Tell Hatch exactly what to ship (the dummy package path)
[tool.hatch.build.targets.wheel]
packages = ["src/cs_8001_odl_public"]
[tool.hatch.build.targets.editable]
packages = ["src/cs_8001_odl_public"]

# --- uv config ---

# Use PEP 508 marker strings for multi-env locks
[tool.uv]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# Use CUDA wheels only on Linux x86_64; others fall back to PyPI CPU wheels
[tool.uv.sources]
torch = [
  { index = "pytorch-cu129", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }
]
torchvision = [
  { index = "pytorch-cu129", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
